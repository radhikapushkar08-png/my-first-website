
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    p {
      color: #c4cddd;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      background: #818cf8;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover {
      background: #6366f1;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Hey, I'm learning to code. 👋</h1>

    <p>
      This is my first website hosted using GitHub Pages.
      I'm learning HTML, CSS and web development!
    </p>

    <a href="https://github.com">
      My coding journey starts here
    </a>
  </main>
</body>
</html>
